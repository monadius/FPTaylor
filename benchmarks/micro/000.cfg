default-rnd = rnd64
nlopt-cc = gcc -std=c99 -O3
opt-exact = true
develop = false
log-append-date = none
uncertainty = false
rel-error = false
opt-approx = true
proof-record = false
find-bounds = false
proof-dir = proofs
opt-f-abs-tol = 0
fail-on-exception = true
print-opt-lower-bounds = true
bb-compile = {base}/b_and_b/compile.sh {base} {input} {out}
z3-python-lib = 
opt-x-abs-tol = 0
export-error-bounds = 
opt-f-rel-tol = 0.01
opt-x-rel-tol = 0.0
rel-error-threshold = 0.0001
bb-alg = opt0
log-base-dir = log
intermediate-opt = false
z3-interval-bounds = true
opt-max-iters = 100000
abs-error = true
z3-bin = 
maxima-simplification = false
print-hex-floats = true
debug = true
export-error-bounds-data = 
fp-power2-model = true
opt = bb
default-var-type = float64
verbosity = 0
ulp-error = false
opt-timeout = 10000
nlopt-lib = -lnlopt -lm
tmp-base-dir = tmp
unique-indices = false
z3-seed = 0
tmp-date = false
z3-python-cmd = python
const-approx-real-vars = false
